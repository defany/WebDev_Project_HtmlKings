name: Deploy Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static artifact (HTML+CSS+images)
        run: |
          set -euo pipefail
          test -f frontend/src/public/index.html

          rm -rf out
          mkdir -p out/styles out/static out/app

          # Копируем как есть
          cp -r frontend/src/public/*  out/
          cp -r frontend/src/styles/*  out/styles/
          cp -r frontend/src/app/*     out/app/
          cp -r frontend/src/static/*  out/static/ 2>/dev/null || true

          # ---- HTML: приводим пути к структуре out/ ----
          find out -type f -name "*.html" -print0 | xargs -0 sed -i \
            -e 's|\.\./\.\./static/|static/|g' \
            -e 's|\.\./static/|static/|g' \
            -e 's|\.\./\.\./styles/|styles/|g' \
            -e 's|\.\./styles/|styles/|g' \
            -e 's|\.\./\.\./app/|app/|g' \
            -e 's|\.\./app/|app/|g'

          # ---- CSS: файлы лежат в styles/, к картинкам нужно ../static ----
          find out -type f -name "*.css" -print0 | xargs -0 sed -i \
            -e 's|\.\./\.\./static/|\.\./static/|g'

          # ---- JS: файлы лежат в app/, к картинкам тоже ../static ----
          find out -type f -name "*.js" -print0 | xargs -0 sed -i \
            -e 's|\.\./\.\./static/|\.\./static/|g'

          # Для дебага
          find out -maxdepth 3 -type f | sed 's|^|  |'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4